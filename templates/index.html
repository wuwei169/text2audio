<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Audio</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f7;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #1d1d1f;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #1d1d1f;
            font-size: 14px;
        }

        input[type="url"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            -webkit-appearance: none;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
        }

        .or-divider {
            text-align: center;
            color: #86868b;
            margin: 16px 0;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover { background: #0077ed; }
        button:disabled { background: #86868b; cursor: not-allowed; }

        .status {
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .status.loading { display: block; background: #fff3cd; color: #856404; }
        .status.error   { display: block; background: #f8d7da; color: #721c24; }
        .status.success { display: block; background: #d4edda; color: #155724; }

        .controls {
            margin-top: 24px;
            display: none;
        }

        .controls.visible { display: block; }

        .playback-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .playback-row button {
            flex: 1;
            margin-top: 0;
            padding: 12px;
            font-size: 15px;
        }

        #pauseBtn  { background: #ff9500; }
        #pauseBtn:hover { background: #e08600; }
        #stopBtn   { background: #ff3b30; }
        #stopBtn:hover { background: #e0352a; }

        .speed-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-row label { margin: 0; font-size: 14px; }

        .speed-row select {
            width: auto;
            padding: 8px 12px;
        }

        .extracted-text { margin-top: 16px; display: none; }
        .extracted-text.visible { display: block; }

        .extracted-text details {
            background: white;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            overflow: hidden;
        }

        .extracted-text summary {
            padding: 12px;
            cursor: pointer;
            font-weight: 500;
            color: #1d1d1f;
            font-size: 14px;
        }

        .extracted-text .text-content {
            padding: 12px;
            border-top: 1px solid #d2d2d7;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #333;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Text to Audio</h1>

    <form id="ttsForm">
        <div class="input-group">
            <label for="url">Article URL</label>
            <input type="url" id="url" name="url" placeholder="https://example.com/article">
        </div>

        <div class="or-divider">— or —</div>

        <div class="input-group">
            <label for="text">Paste Text</label>
            <textarea id="text" name="text" placeholder="Paste your text here..."></textarea>
        </div>

        <div class="input-group">
            <label for="voice">Voice</label>
            <select id="voice" name="voice"></select>
        </div>

        <button type="submit" id="convertBtn">Convert to Audio</button>
    </form>

    <div id="status" class="status"></div>

    <div id="extractedTextContainer" class="extracted-text">
        <details>
            <summary>Extracted Text (<span id="charCount">0</span> characters)</summary>
            <div id="extractedText" class="text-content"></div>
        </details>
    </div>

    <div id="controls" class="controls">
        <div class="playback-row">
            <button id="pauseBtn">Pause</button>
            <button id="stopBtn">Stop</button>
        </div>
        <div class="speed-row">
            <label for="playbackSpeed">Speed:</label>
            <select id="playbackSpeed">
                <option value="1">100%</option>
                <option value="0.9">90%</option>
                <option value="0.8">80%</option>
            </select>
        </div>
    </div>

    <script>
        const form = document.getElementById('ttsForm');
        const convertBtn = document.getElementById('convertBtn');
        const statusEl = document.getElementById('status');
        const controls = document.getElementById('controls');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const extractedTextContainer = document.getElementById('extractedTextContainer');
        const extractedTextEl = document.getElementById('extractedText');
        const charCount = document.getElementById('charCount');
        const voiceSelect = document.getElementById('voice');
        const speedSelect = document.getElementById('playbackSpeed');

        // --- Voice loading ---
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const englishVoices = voices.filter(v => v.lang.startsWith('en'));
            const toShow = englishVoices.length > 0 ? englishVoices : voices;
            voiceSelect.innerHTML = '';
            toShow.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
        }

        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // --- Form submit ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            speechSynthesis.cancel();

            const url = document.getElementById('url').value.trim();
            let text = document.getElementById('text').value.trim();

            if (!url && !text) {
                showStatus('Please enter a URL or paste some text.', 'error');
                return;
            }

            convertBtn.disabled = true;
            convertBtn.innerHTML = '<span class="spinner"></span>Converting...';
            controls.classList.remove('visible');
            extractedTextContainer.classList.remove('visible');

            try {
                if (url) {
                    showStatus('Extracting text from URL...', 'loading');
                    const res = await fetch('/extract', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error || 'Failed to extract text');
                    }
                    const data = await res.json();
                    text = data.text;
                    extractedTextEl.textContent = text;
                    charCount.textContent = data.length.toLocaleString();
                    extractedTextContainer.classList.add('visible');
                }

                showStatus('Speaking...', 'success');
                speak(text);
                controls.classList.add('visible');

            } catch (err) {
                showStatus('Error: ' + err.message, 'error');
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = 'Convert to Audio';
            }
        });

        // --- Speech synthesis ---
        function speak(text) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = speechSynthesis.getVoices();
            const selected = voices.find(v => v.name === voiceSelect.value);
            if (selected) utterance.voice = selected;
            utterance.rate = parseFloat(speedSelect.value);
            utterance.onend = () => {
                showStatus('Done.', 'success');
                pauseBtn.textContent = 'Pause';
            };
            utterance.onerror = (e) => { if (e.error !== 'interrupted') showStatus('Speech error: ' + e.error, 'error'); };
            speechSynthesis.speak(utterance);
            pauseBtn.textContent = 'Pause';
        }

        pauseBtn.addEventListener('click', () => {
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                pauseBtn.textContent = 'Pause';
            } else {
                speechSynthesis.pause();
                pauseBtn.textContent = 'Resume';
            }
        });

        stopBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            controls.classList.remove('visible');
            showStatus('Stopped.', 'loading');
        });

        // Speed change restarts with new rate
        speedSelect.addEventListener('change', () => {
            if (speechSynthesis.speaking || speechSynthesis.paused) {
                const text = extractedTextEl.textContent || document.getElementById('text').value.trim();
                if (text) speak(text);
            }
        });

        function showStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        // Mutual exclusivity of URL and text inputs
        document.getElementById('url').addEventListener('input', function() {
            if (this.value) document.getElementById('text').value = '';
        });
        document.getElementById('text').addEventListener('input', function() {
            if (this.value) document.getElementById('url').value = '';
        });
    </script>
</body>
</html>
